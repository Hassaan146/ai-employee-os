version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: employeeos_postgres
    environment:
      POSTGRES_DB: employeeos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: employeeos_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
